# openspec/config.yaml — SDD bootstrap (generated by sdd-init)
schema: spec-driven
project: aplicacion-para-laboratorio-clinico
product: LabCore
persistence: openspec
created: 2026-08-18

context: |
  Stack: Electron 33 + Vite 7 + React 19 + TypeScript 5.9, plain npm
  Packaging: electron-builder 26, NSIS, appId com.labcore.app
  Data: better-sqlite3 (WAL, foreign_keys on), lab_clinical.db at repo root (dev) / userData (prod)
  Product: desktop pro, offline-first, ONE Venezuelan clinical laboratory (user decision)
  Tests: no runner installed (strict_tdd off; Vitest is an open design decision)
  CI: none
  Details: openspec/project-context.md

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
    - Resolve open decisions listed in openspec/project-context.md (test runner, styling, state, sqlite dual dep)
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns in src/ and electron/
      - Never open lab_clinical.db from a Node CLI script outside Electron (native ABI mismatch, NODE_MODULE_VERSION 130 vs 137)
      - Quote all shell paths; project path contains spaces
    tdd: false
    test_command: ""
  verify:
    test_command: ""
    build_command: "npm run build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas

testing:
  strict_tdd: false
  strict_tdd_reason: "No test runner installed (no vitest/jest/playwright in package.json)"
  test_runner: null
  add_runner_decision: open
  detected: 2026-08-18
  layers:
    unit: false
    integration: false
    e2e: false
  coverage: false
  quality:
    linter: "npm run lint (eslint 9 + typescript-eslint)"
    type_checker: "npx tsc -b (runs inside npm run build)"
    formatter: none
  details: openspec/testing-capabilities.md
